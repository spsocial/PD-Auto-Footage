<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🛒 เลือกสินค้า — PD Auto Footage</title>
  <style>
    /* ธีมดำสนิท + ส้มอำพันตัดจุดสำคัญ (ตาม panel v0.1.1) */
    :root {
      --bg: #09090b; --surface: #111114; --surface-2: #1a1a1f;
      --border: rgba(255,255,255,0.09); --border-strong: rgba(255,255,255,0.18);
      --accent: #f59e0b; --text: #ececf0; --muted: #8b8b96;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI','Leelawadee UI',Tahoma,sans-serif; }
    .topbar {
      position: sticky; top: 0; z-index: 50;
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      padding: 13px 22px; background: rgba(9,9,11,0.96); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand img { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--border); }
    .t1 { font-size: 15px; font-weight: 800; }
    .t1 b { color: var(--accent); }
    .t2 { font-size: 11px; color: var(--muted); }
    #searchInput {
      flex: 1; min-width: 220px; max-width: 440px;
      padding: 9px 14px; border-radius: 9px; outline: none;
      background: var(--surface); border: 1px solid var(--border); color: var(--text); font-size: 13px;
    }
    #searchInput:focus { border-color: var(--accent); }
    .ctl {
      padding: 8px 12px; border-radius: 8px; font-size: 12px; cursor: pointer;
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
    }
    .ctl:hover { border-color: var(--border-strong); }
    .count-pill { font-size: 12px; color: var(--muted); padding: 6px 12px; border: 1px dashed var(--border-strong); border-radius: 999px; }
    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px; padding: 18px 22px 110px 22px; max-width: 1500px; margin: 0 auto;
    }
    .card {
      background: var(--surface); border: 1.5px solid var(--border); border-radius: 14px;
      overflow: hidden; cursor: pointer; position: relative;
      transition: transform .12s ease, border-color .12s ease;
    }
    .card:hover { transform: translateY(-2px); border-color: var(--border-strong); }
    .card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(245,158,11,0.3); }
    .imgwrap { aspect-ratio: 1/1; background: var(--surface-2); position: relative; }
    .imgwrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .tick {
      position: absolute; top: 8px; left: 8px; width: 24px; height: 24px; border-radius: 7px;
      background: rgba(0,0,0,0.7); border: 1.5px solid rgba(255,255,255,0.35);
      display: grid; place-items: center; font-size: 14px; color: transparent;
    }
    .card.selected .tick { background: var(--accent); border-color: var(--accent); color: #1a1106; }
    .meta { padding: 10px 12px 12px 12px; }
    .name { font-size: 12.5px; font-weight: 600; line-height: 1.35; height: 2.7em; overflow: hidden; }
    .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .chip { font-size: 10.5px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); }
    .chip.price { color: var(--accent); }
    .empty { grid-column: 1/-1; text-align: center; color: var(--muted); padding: 80px 20px; font-size: 14px; line-height: 2; }
    .img-btn { position: absolute; bottom: 8px; right: 8px; background: rgba(9,9,11,0.82); border: 1px solid var(--border-strong); color: #ececf0; font-size: 10.5px; padding: 4px 9px; border-radius: 7px; cursor: pointer; opacity: 0; transition: opacity .12s; }
    .card:hover .img-btn { opacity: 1; }
    .img-btn:hover { border-color: var(--accent); color: var(--accent); }
    .imgpick-overlay { position: fixed; inset: 0; z-index: 120; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; padding: 14px; }
    .imgpick-card { width: 100%; max-width: 720px; max-height: 90vh; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 14px; display: flex; flex-direction: column; overflow: hidden; }
    .imgpick-head { padding: 12px 14px; font-size: 13px; font-weight: 800; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .imgpick-grid { overflow-y: auto; padding: 14px; display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
    .imgpick-grid img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 10px; border: 2.5px solid transparent; cursor: pointer; background: var(--surface-2); }
    .imgpick-grid img:hover { border-color: var(--border-strong); }
    .imgpick-grid img.sel { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(245,158,11,0.3); }
    .actionbar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
      display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap;
      padding: 12px 18px; background: rgba(9,9,11,0.97); backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
    }
    .sel-info { font-size: 13px; color: var(--muted); }
    .sel-info b { color: var(--accent); font-size: 15px; }
    .btn-primary {
      padding: 11px 26px; border-radius: 10px; border: none; cursor: pointer;
      background: linear-gradient(135deg, #d97706, var(--accent)); color: #1a1106;
      font-size: 14px; font-weight: 800;
    }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-ghost { padding: 11px 18px; border-radius: 10px; cursor: pointer; background: transparent; border: 1px solid var(--border); color: var(--muted); font-size: 13px; }
    #toast {
      position: fixed; top: 18px; left: 50%; transform: translateX(-50%) translateY(-80px);
      background: var(--surface-2); border: 1px solid var(--border-strong); color: var(--text);
      padding: 10px 18px; border-radius: 10px; font-size: 13px; z-index: 200;
      transition: transform .25s ease;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }
    ::-webkit-scrollbar { width: 9px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 99px; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <img src="../assets/logo.png" alt="">
      <div>
        <div class="t1">เลือกสินค้า <b>FOOTAGE</b></div>
        <div class="t2">ติ๊กสินค้าที่จะทำโฆษณา (สูงสุด 10)</div>
      </div>
    </div>
    <input type="text" id="searchInput" placeholder="🔍 ค้นหาชื่อสินค้า...">
    <select class="ctl" id="sortSelect" title="เรียงลำดับ">
      <option value="default" selected>↕️ เรียงตามเดิม</option>
      <option value="comm_desc">💰 ค่าคอม มาก→น้อย</option>
      <option value="comm_asc">💰 ค่าคอม น้อย→มาก</option>
      <option value="price_desc">฿ ราคา แพง→ถูก</option>
      <option value="price_asc">฿ ราคา ถูก→แพง</option>
    </select>
    <button class="ctl" id="selectAllBtn">✓ เลือก 10 ตัวแรก</button>
    <button class="ctl" id="clearBtn">✗ ล้างที่เลือก</button>
    <span class="count-pill" id="countPill">…</span>
    <button class="ctl" id="closeBtn">✕ ปิด</button>
  </div>
  <div class="grid" id="grid"><div class="empty">⏳ กำลังโหลด...</div></div>
  <div class="actionbar">
    <span class="sel-info">เลือกแล้ว <b id="selCount">0</b>/10</span>
    <button class="btn-ghost" id="cancelBtn">ยกเลิก</button>
    <button class="btn-primary" id="applyBtn" disabled>✅ ใช้สินค้าที่เลือก</button>
  </div>
  <div id="toast"></div>
  <script src="picker.js"></script>
</body>
</html>
